[project]
name = "loanlens"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
description = "Explainable housing loan screening website"
dependencies = [
  "fastapi==0.163.1",
  "uvicorn==0.54.0",
  "pandas==2.3.3",
  "numpy==2.5.5",
  "scikit-learn==1.7.2",
  "imbalanced-learn==0.14.2",
  "shap==0.50.0",
  "joblib==1.6.0",
  "matplotlib==3.11.2",
]

[tool.vercel]
entrypoint = "web.server:app"

[tool.vercel.scripts]
build = "python -m src.download_data"
